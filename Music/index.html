<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pan & Apollo’s Wild Jukebox</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; background: #fff9c4; color: #2e7d32; margin: 0; position: relative; overflow: visible; }
    #background-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; display: none; }
    h1 { color: #3e2723; margin: 5px 0; font-size: 24px; }
    p { margin: 0 0 10px; font-size: 14px; }
    select, textarea, button, input { display: block; margin: 5px auto; padding: 8px; font-size: 14px; border: 2px solid #2e7d32; border-radius: 5px; background: #ffffff; color: #3e2723; }
    select { width: 340px; }
    textarea { width: 300px; height: 120px; resize: vertical; }
    button { width: 130px; background: #2e7d32; color: #ffffff; border: none; cursor: pointer; }
    button:hover { background: #3e2723; }
    #output, #prediction { margin-top: 10px; font-size: 16px; color: #2e7d32; }
    .prediction-box, .input-box { background: #ffffff; padding: 10px; border: 2px solid #2e7d32; border-radius: 10px; width: 300px; margin: 10px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .prediction-box h3 { margin: 0 0 5px; color: #3e2723; font-size: 18px; }
    .input-box label { display: block; margin-bottom: 5px; font-weight: bold; color: #3e2723; }
    .input-box input { width: 100%; box-sizing: border-box; }
    .jukebox-container { display: flex; justify-content: center; align-items: center; margin: 10px 0; }
    .prediction-image { position: relative; width: 90px; height: 90px; margin: 5px 0; border-radius: 50%; box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.6); opacity: 0; transition: opacity 1s ease-in-out; }
    .prediction-image.visible { opacity: 1; }
    .fallback { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #2e7d32; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #3e2723; }
    .number-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffffff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); background: rgba(0,0,0,0.5); padding: 4px; border-radius: 50%; }
  </style>
</head>
<body onclick="unlockAudio()">
  <video id="background-video" muted loop>
    <source src="Firefly.MP4" type="video/mp4">
  </video>

  <h1>Pan & Apollo’s Wild Jukebox</h1>
  <p>Click anywhere to unlock audio, then crank away!</p>

  <select id="game" onchange="loadDataset()">
    <option value="lotto">Lotto (6 from 1-52)</option>
    <option value="plus1">Lotto Plus 1 (6 from 1-52)</option>
    <option value="plus2">Lotto Plus 2 (6 from 1-52)</option>
    <option value="powerball">Powerball (5 from 1-50 + PB 1-16)</option>
    <option value="powerballplus">Powerball Plus (5 from 1-50 + PB 1-16)</option>
  </select>

  <textarea id="input" readonly></textarea>

  <button onclick="crankJukebox()">Crank It!</button>

  <div class="input-box">
    <label>Add Latest Draw</label>
    <input type="text" id="newNumbers" placeholder="e.g. 5 8 12 19 48 1">
    <button onclick="addDraw()">Add Draw</button>
    <button onclick="rollbackDraw()">Rollback</button>
  </div>

  <div class="jukebox-container">
    <div class="jukebox-side" id="left-side"></div>
    <img id="jukebox-img" src="Music Box.jpg" alt="Pan & Apollo’s Wild Jukebox">
    <div class="jukebox-side" id="right-side"></div>
  </div>

  <div id="output"></div>
  <div class="prediction-box" id="prediction">
    <h3>Predicted Next Draw</h3>
    <p id="prediction-text">Click "Crank It!" to see the prediction</p>
  </div>

  <footer>
    This application was developed by suggestion of Pan and Apollo.<br>
    Pan: God of the wild... | Apollo: God of music...
  </footer>

  <script>
    const words = ["breeze","storm","river","wave","cloud","rain","wind","mist","leaf","tree","branch","root","stone","cliff","hill","peak","valley","ridge","cave","rock","sand","dust","earth","sea","lake","pond","brook","fog","snow","ice","frost","dew","tide","shore","dune","field","plain","meadow","forest","grove","wood","glade","swamp","marsh","heath","moor","tundra","desert","jungle","savanna","prairie","canyon"];

    const mp3Tunes = ["HARP.MP3", "HARP2.MP3", "FLUTE.MP3", "FLUTE2.MP3"];
    let currentAudio = null;
    let audioUnlocked = false;
    const backgroundVideo = document.getElementById("background-video");

    // === UPDATED DATASETS (June 2026 - most recent first) ===
    const defaultDatasets = {
      lotto: [
        ["15 16 17 18 25 33"], ["8 16 20 40 50 51"], ["5 8 19 30 44 46"],
        ["21 35 39 46 51 56"], ["9 16 25 44 50 54"], ["2 8 15 32 50 51"],
        ["14 16 22 24 29 35"], ["4 8 12 18 28 38"], ["12 18 21 25 27 38"],
        ["3 12 16 18 31 51"], ["2 3 17 27 29 37"], ["6 23 24 32 39 48"],
        ["7 12 24 32 39 48"], ["7 19 23 27 31 52"], ["2 8 37 45 48 51"]
      ],
      plus1: [
        ["11 12 35 44 45 46"], ["19 20 32 37 45 51"], ["9 16 25 44 50 54"],
        ["5 31 46 47 55 58"], ["4 7 18 21 39 42"], ["3 26 33 38 39 41"],
        ["10 15 17 27 29 47"], ["6 9 18 22 25 27"], ["33 36 38 40 46 49"],
        ["2 3 10 20 27 44"], ["8 21 22 39 47 52"], ["3 14 20 30 35 42"]
      ],
      plus2: [
        ["2 10 19 24 38 41"], ["7 33 34 38 40 47"], ["1 3 5 13 18 22"],
        ["8 19 23 38 40 42"], ["1 4 10 13 28 33"], ["8 14 16 42 43 52"],
        ["1 10 23 29 34 47"], ["4 8 27 31 35 43"], ["25 26 31 33 34 45"],
        ["3 23 27 44 45 47"], ["1 8 14 21 26 29"], ["9 25 33 37 40 51"]
      ],
      powerball: [
        ["5 8 12 19 48 1"], ["2 16 33 37 43 6"], ["2 10 22 28 49 7"],
        ["9 14 16 25 30 14"], ["1 9 30 31 47 3"], ["6 8 16 22 25 18"],
        ["14 23 31 33 38 7"], ["4 7 11 24 39 3"], ["15 16 37 43 44 11"],
        ["2 4 5 19 31 15"], ["4 6 15 20 50 3"], ["2 26 30 42 47 3"]
      ],
      powerballplus: [
        ["19 32 40 45 48 11"], ["4 12 27 35 41 15"], ["2 23 44 48 50 14"],
        ["13 27 29 36 37 10"], ["6 8 13 37 45 7"], ["10 16 20 41 49 7"],
        ["17 38 45 46 50 16"], ["2 16 19 27 42 17"], ["1 14 17 31 49 2"],
        ["6 23 27 29 45 16"], ["2 22 23 46 49 19"], ["6 20 38 44 46 8"]
      ]
    };

    let datasets = JSON.parse(localStorage.getItem('jukeboxDatasets')) || defaultDatasets;
    const originalDatasets = JSON.parse(JSON.stringify(defaultDatasets));

    const fifthsCycle52 = [1,8,15,22,29,36,43,50,5,12,19,26,33,40,47,2,9,16,23,30,37,44,51,6,13,20,27,34,41,48,3,10,17,24,31,38,45,52,7,14,21,28,35,42,49,4,11,18,25,32,39,46];
    const fifthsCycle50 = fifthsCycle52.slice(0, 50);
    const octavePositions = Array(53).fill(0).map((_, i) => i ? ((i - 1) % 12) + 1 : 0);
    const isMajor = pos => [1, 3, 5, 7, 8, 10, 12].includes(pos);

    function saveDatasets() {
      localStorage.setItem('jukeboxDatasets', JSON.stringify(datasets));
    }

    function unlockAudio() {
      if (!audioUnlocked) {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        context.resume().then(() => { audioUnlocked = true; document.getElementById("output").innerHTML = "Audio unlocked! Ready to crank!"; }).catch(() => {});
      }
    }

    function loadDataset() {
      const game = document.getElementById("game").value;
      const data = datasets[game];
      document.getElementById("input").value = data.map(([nums]) => nums).join("\n");
    }

    function addDraw() {
      const game = document.getElementById("game").value;
      const input = document.getElementById("newNumbers").value.trim();
      if (!input) { alert("Enter numbers!"); return; }

      const nums = input.split(" ").map(Number);
      const isPB = game.includes("powerball");

      if (isPB) {
        if (nums.length !== 6 || nums.some(isNaN)) { alert("Exactly 6 numbers for Powerball!"); return; }
        if (nums.slice(0,5).some(n => n<1||n>50) || nums[5]<1 || nums[5]>16) { alert("Main 1-50 | PB 1-16"); return; }
      } else {
        if (nums.length !== 6 || nums.some(n => n<1||n>52||isNaN(n))) { alert("Exactly 6 numbers 1-52!"); return; }
      }

      datasets[game].unshift([input]);
      if (datasets[game].length > 36) datasets[game].pop();
      saveDatasets();
      loadDataset();
      document.getElementById("newNumbers").value = "";
    }

    function rollbackDraw() {
      const game = document.getElementById("game").value;
      if (datasets[game].length > originalDatasets[game].length) {
        datasets[game].shift();
        saveDatasets();
        loadDataset();
      } else alert("Nothing to rollback!");
    }

    function predictNextDraw(game) {
      const draws = datasets[game].slice(0, 36);
      const isPowerball = game.includes("powerball");
      const maxMain = isPowerball ? 50 : 52;
      const maxPB = 16;
      const freq = Array(maxMain + 1).fill(0);
      const pbFreq = isPowerball ? Array(maxPB + 1).fill(0) : null;

      // Weighting: older ×1, newest 5 ×2
      draws.slice(5).forEach(([str]) => {
        const n = str.split(" ").map(Number);
        if (isPowerball) {
          n.slice(0,5).forEach(x => freq[x]++);
          if (n[5] <= maxPB) pbFreq[n[5]]++;
        } else n.forEach(x => freq[x]++);
      });
      draws.slice(0,5).forEach(([str]) => {
        const n = str.split(" ").map(Number);
        if (isPowerball) {
          n.slice(0,5).forEach(x => freq[x] += 2);
          if (n[5] <= maxPB) pbFreq[n[5]] += 2;
        } else n.forEach(x => freq[x] += 2);
      });

      const cycle = isPowerball ? fifthsCycle50 : fifthsCycle52;
      const candidates = cycle.map(num => ({
        num, freq: freq[num],
        isMajor: isMajor(octavePositions[num]),
        score: freq[num] + (isMajor(octavePositions[num]) ? 1 : 0)
      }));

      if (isPowerball) {
        const mains = candidates.sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.num).sort((a,b)=>a-b);
        const pb = Array.from({length:maxPB},(_,i)=>i+1).sort((a,b)=>(pbFreq[b]||0)-(pbFreq[a]||0))[0];
        return [...mains, pb];
      } else {
        const majors = candidates.filter(x=>x.isMajor).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.num);
        const minors = candidates.filter(x=>!x.isMajor).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.num);
        return [...majors, ...minors].sort((a,b)=>a-b);
      }
    }

    function displayPredictionImages(predictedNums) {
      const left = document.getElementById("left-side");
      const right = document.getElementById("right-side");
      left.innerHTML = ""; right.innerHTML = "";

      predictedNums.forEach((num, i) => {
        setTimeout(() => {
          const div = document.createElement("div");
          div.className = "prediction-image";

          const img = document.createElement("img");
          img.src = `${words[num-1]}.jpg`;
          img.style.width = img.style.height = "100%";
          img.style.borderRadius = "50%";
          img.style.objectFit = "cover";
          img.onerror = () => { img.style.display="none"; const f=document.createElement("div"); f.className="fallback"; f.textContent=words[num-1]; div.appendChild(f); };
          div.appendChild(img);

          const overlay = document.createElement("div");
          overlay.className = "number-overlay";
          overlay.textContent = num;
          div.appendChild(overlay);

          (i < 3 ? left : right).appendChild(div);
          setTimeout(() => div.classList.add("visible"), 50);
        }, i * 800);
      });
    }

    async function crankJukebox() {
      if (!audioUnlocked) { document.getElementById("output").innerHTML = "Click page to unlock audio!"; return; }

      const game = document.getElementById("game").value;
      const output = document.getElementById("output");
      const predText = document.getElementById("prediction-text");
      output.innerHTML = "";

      // Audio + Video (your original logic kept)
      if (currentAudio) currentAudio.pause();
      const tune = mp3Tunes[Math.floor(Math.random()*mp3Tunes.length)];
      currentAudio = new Audio(tune);
      currentAudio.play();
      backgroundVideo.style.display = "block";
      backgroundVideo.play();

      setTimeout(() => { if(currentAudio) currentAudio.pause(); backgroundVideo.style.display="none"; }, 15000);

      // Display recent tunes
      const data = datasets[game].slice(0,6);
      data.forEach(([nums]) => {
        const tuneLine = nums.split(" ").map(n => words[n-1]).join(" ");
        const div = document.createElement("div"); div.className="tune-line"; div.textContent = tuneLine; output.appendChild(div);
      });

      // Predict & show
      const predicted = predictNextDraw(game);
      predText.textContent = predicted.join(" ");
      displayPredictionImages(predicted);
    }

    loadDataset();
  </script>
</body>
</html>
